spring.application.name=exgpu
server.port=8080

# SECURITY: bind to loopback so the REST API and WebSocket are reachable only from this
# machine, not the LAN. The CORS/WS origin checks only stop browsers — binding to 127.0.0.1
# is what stops non-browser clients (curl, wscat) on the network from reading data.
# Override with SERVER_ADDRESS=0.0.0.0 ONLY if you must scrape /actuator/prometheus from a
# Docker container; doing so exposes port 8080 to the network, so keep it behind a firewall.
server.address=${SERVER_ADDRESS:127.0.0.1}

# SECURITY: never leak internals in error responses (stack traces, exception classes, raw
# messages). Intentional, safe messages are still returned by GlobalExceptionHandler.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Redis is not needed yet — keep excluded. Kafka is now active.
# DataSource, JPA, and Flyway are now active (requires Docker Compose postgres).
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Serialize Instant as ISO-8601 strings
spring.jackson.serialization.write-dates-as-timestamps=false

# Load exgpu/.env (same file docker-compose reads) so DB_*/SERVER_ADDRESS resolve when the
# app is started with `./mvnw spring-boot:run`. Without this, .env is a compose-only file and
# the ${DB_PASSWORD:exgpu} default below silently disagrees with the password Postgres was
# initialized with. `optional:` means a missing .env is not an error; real environment
# variables still win over anything in the file.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL — credentials come from the environment; the defaults are for local dev only.
# Override DB_USERNAME / DB_PASSWORD (and the compose values) before any non-local use.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exgpu}
spring.datasource.username=${DB_USERNAME:exgpu}
spring.datasource.password=${DB_PASSWORD:exgpu}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway owns DDL; Hibernate must not touch it
spring.jpa.hibernate.ddl-auto=none
# SECURITY: keep SQL logging off — it can echo ids, balances and other data into logs.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=exgpu-billing-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.exgpu.exgpu.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.exgpu.exgpu.kafka.UsageEventMessage

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Topic names
exgpu.kafka.usage-events-topic=exgpu.usage-events
exgpu.kafka.usage-events-dlq=exgpu.usage-events.dlq

# Actuator — expose only health (dashboard) and prometheus (metrics scrape). No env/info/
# beans/heapdump/etc. Health never reveals component details (db status, disk paths…).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=false

# Flyway — path matches actual folder on disk
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# --- Virtual threads (A3) -----------------------------------------------------------------
# Safe ONLY because MatchingEngine's one-and-only `synchronized` was replaced with a
# ReentrantLock first (see MatchingEngine's class Javadoc). On Java 21 (not yet 24 / JEP 491),
# a virtual thread that blocks on a monitor pins its carrier; a ReentrantLock instead parks the
# virtual thread and frees the carrier. Also switches Spring's TaskExecutor/TaskScheduler to
# virtual threads (AccessLeaseScheduler's fixedDelay semantics are preserved); Kafka listener
# containers keep their own executor and are unaffected. Watch HikariCP: virtual threads make
# it easy to have far more in-flight requests than the 10-connection default pool.
spring.threads.virtual.enabled=true

# --- Matching engine concurrency (A1/A2) ---------------------------------------------------
# Two independent, fixed-size ReentrantLock[] arrays — see TimeSliceLockManager's class
# Javadoc for the two-tier locking discipline and why each size was chosen.
exgpu.matching.lock-stripes=1024
exgpu.matching.order-lock-stripes=512
# A single POST /orders window may not exceed this many hours (D3) — bounds the tier-1 lock
# set a striped match acquires. Sellers who want multi-day availability use a recurring
# listing (A4) instead of one very long order. Placement-time only; rehydration accepts any
# pre-existing span.
exgpu.matching.max-window-hours=24
# Flips MatchingEngine between the Step 6 single-lock fallback (false) and the striped
# two-tier path (true) described in TimeSliceLockManager. Left true only once the concurrency
# suite (MatchingEngineConcurrencyTest) is green against it.
exgpu.matching.striped=true
# Rebuild the in-memory order book from Postgres once, at ApplicationReadyEvent (B3). Disabled
# in src/test/resources/application.properties, where there is no DataSource to query.
exgpu.matching.rehydrate-on-startup=true

# --- Recurring listings (A4) ----------------------------------------------------------------
exgpu.orders.max-occurrences=60
exgpu.orders.max-horizon-days=90

# --- Supabase Auth ---------------------------------------------------------------
# Identity is owned by Supabase; this app never sees or stores a password. It only
# verifies the access tokens the frontend obtains from Supabase.
#
# The project signs with ES256 (asymmetric), so verification needs the PUBLIC JWKS only —
# there is no shared secret here and nothing in this block is sensitive. SUPABASE_URL comes
# from .env, which is imported above.
exgpu.supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
exgpu.supabase.issuer=${exgpu.supabase.url}/auth/v1
exgpu.supabase.jwk-set-uri=${exgpu.supabase.url}/auth/v1/.well-known/jwks.json

# --- Compute access credentials --------------------------------------------------
# HMAC key used to sign short-lived access tokens. A GPU node verifies tokens with this
# same key, so it is a genuine shared secret: override it via the environment before any
# non-local use. The dev default exists only so the app starts without configuration.
# Rotating it invalidates every outstanding credential immediately, which is the intended
# emergency lever.
exgpu.access.signing-secret=${ACCESS_SIGNING_SECRET:dev-only-insecure-access-signing-key-change-me}
