# Test-scope override — takes precedence over src/main/resources/application.properties.
# Excludes all infrastructure so unit and slice tests pass without Docker Compose running.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.jackson.serialization.write-dates-as-timestamps=false

# Supabase JWT settings. Tests never reach the network: slice tests stub the JwtDecoder and
# unit tests do not load the web layer at all. These exist so SecurityConfig can be
# constructed without a live project.
exgpu.supabase.url=https://test.supabase.co
exgpu.supabase.issuer=https://test.supabase.co/auth/v1
exgpu.supabase.jwk-set-uri=https://test.supabase.co/auth/v1/.well-known/jwks.json

# Fixed key so credential tests can assert exact token bytes.
exgpu.access.signing-secret=test-signing-secret

# No DataSource in the test slice profile above, so there is nothing for OrderBookRehydrator to
# query. Belt and braces: ExgpuApplicationTests already @MockBeans MatchingEngine and Mockito
# returns an empty List rather than null, so the rehydrator would be harmless anyway — this
# flag makes it unconditional (and keeps the @Component out of the context entirely).
exgpu.matching.rehydrate-on-startup=false
